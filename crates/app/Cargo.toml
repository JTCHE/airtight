[package]
name = "airtight-app"
description = "Airtight: stream what Windows plays to an AirPlay 2 receiver, from the tray."
edition.workspace = true
version.workspace = true

[[bin]]
name = "airtight"
path = "src/main.rs"

[dependencies]
airtight-airplay = { path = "../airplay" }
airtight-audio = { path = "../audio" }
airtight-log = { path = "../log" }
airtight-media = { path = "../media" }
airtight-wire = { path = "../wire" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
